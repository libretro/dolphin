name: Build Dolphin (libretro) for Android

on: [push, pull_request]

env:
  core_id: dolphin_libretro
  ANDROID_NDK_VERSION: r26c
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-26

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Dolphin (libretro) repo
      uses: actions/checkout@v4
      with:
        path: ${{ env.core_id }}

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{ env.ANDROID_NDK_VERSION }}

    - name: Configure (CMake with Android toolchain)
      run: |
        cd ${{ env.core_id }}
        mkdir -p build && cd build
        cmake .. \
          -DLIBRETRO=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} \
          -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install

    - name: Build
      run: |
        cd ${{ env.core_id }}/build
        make -j$(nproc)

    - name: Package core
      run: |
        mkdir -p artifacts
        cp ${{ env.core_id }}/build/${{ env.core_id }}.so artifacts/${{ env.core_id }}_${{ env.ANDROID_ABI }}.so
        cd artifacts
        zip ${{ env.core_id }}_${{ env.ANDROID_ABI }}.zip ${{ env.core_id }}_${{ env.ANDROID_ABI }}.so

    - name: Upload zipped artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.core_id }}_${{ env.ANDROID_ABI }}.zip
        path: artifacts/${{ env.core_id }}_${{ env.ANDROID_ABI }}.zip
